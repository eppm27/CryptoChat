services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - '3000:3000'
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI
      - JWT_SECRET
      - GEMINI_API_KEY
      - EMAIL_LOGIN
      - EMAIL_PASSWORD
      - ALPHA_VANTAGE_API_KEY
      - MONGODB_URI_CRYPTO
      - TWELVE_DATA_API_KEY
      - RAPIDAPI_KEY
      - ALPHA_VANTAGE_IND_KEY
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6
    ports:
      - '27017:27017' # Optional (only if accessing DB externally)
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
